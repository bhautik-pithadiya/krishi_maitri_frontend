version: '3.8'

services:
  krishi-maitri-ui:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: krishi-maitri-ui
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - krishi-network

  # Optional: Add development service
  krishi-maitri-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: krishi-maitri-ui-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    networks:
      - krishi-network
    profiles:
      - dev

networks:
  krishi-network:
    driver: bridge
